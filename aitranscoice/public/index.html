<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌐 AITRANSVOICE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🌐 AITRANSVOICE</h1>
    <p class="subtitle">Traducción instantánea de voz y texto</p>

    <!-- Selectores de idioma -->
    <div class="selectors">
      <div>
        <label for="fromLanguage">De:</label>
        <select id="fromLanguage"></select>
      </div>
      <div>
        <label for="toLanguage">A:</label>
        <select id="toLanguage"></select>
      </div>
    </div>

    <!-- Áreas de texto -->
    <div class="text-areas">
      <textarea id="inputText" placeholder="Escribe o dicta aquí..."></textarea>
      <textarea id="outputText" placeholder="Traducción..." readonly></textarea>
    </div>

    <!-- Botones -->
    <div class="buttons">
      <button id="dictateBtn">🎤 Dictar</button>
      <button id="translateBtn">🌍 Traducir</button>
      <button id="speakBtn">🔊 Escuchar</button>
    </div>
    <label><input id="useMeta" type="checkbox" disabled> Traducción de texto con Meta Model API</label>
    <section>
      <h2>Voz expresiva de Meta (experimental)</h2>
      <p>Español ↔ inglés (EE. UU.). Usa una grabación breve en WAV de tu propia voz o de alguien que haya dado su permiso.</p>
      <input id="voiceFile" type="file" accept=".wav,audio/wav" aria-label="Grabación WAV">
      <button id="expressiveBtn" type="button" disabled>Traducir audio con SeamlessExpressive</button>
      <audio id="expressiveAudio" controls hidden></audio>
    </section>
    <p id="translationStatus" role="status"></p>

  </div>

  <script src="script.js"></script>
</body>
</html>
