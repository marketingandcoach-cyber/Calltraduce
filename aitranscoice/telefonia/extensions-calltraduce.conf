; Include this file from extensions.conf. Route only a dedicated test DID
; or a private SIP extension to 600,1 in this context.
[calltraduce-piloto]
exten => 600,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=calltraduce-limpieza,s,1(${UNIQUEID}))
 same => n,Read(CALLTRADUCE_CONSENT,custom/calltraduce-consent,1,,1,8)
 same => n,GotoIf($["${CALLTRADUCE_CONSENT}" = "1"]?record)
 same => n,Hangup()
 same => n(record),Set(CALLTRADUCE_FILE=/var/spool/asterisk/calltraduce/${UNIQUEID})
 same => n,Record(${CALLTRADUCE_FILE}-source.wav,2,10)
 same => n,GotoIf($["${RECORD_STATUS}" = "ERROR"]?failed)
 same => n,AGI(calltraduce_agi.py,translate,${UNIQUEID})
 same => n,GotoIf($["${CALLTRADUCE_RESULT}" = "OK"]?translated)
 same => n(failed),Playback(custom/calltraduce-error)
 same => n,Hangup()
 same => n(translated),Playback(${CALLTRADUCE_FILE}-translated)
 same => n,Hangup()

[calltraduce-limpieza]
exten => s,1,AGI(calltraduce_agi.py,cleanup,${ARG1})
 same => n,Return()
